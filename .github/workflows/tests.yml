name: tests

# Runs the trust-dial spec suite on every PR and on pushes to master.
# These specs are hermetic (stdlib unittest, tempdirs, local git) — no network,
# no local qwen backend, no ~/.qwen config (that read is try/except-guarded).
# Scope is deliberately the trust work: trust_spec (the R3 slider: resolution
# chain, self-gate guards, auto mode) + engine_spec (L5-default + refusal paths).
# The wall-clock-timing dispatch_spec is intentionally excluded — it is flaky by
# nature and would make a required check unreliable.

on:
  pull_request:
  push:
    branches: [master]

jobs:
  trust-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity
        # The specs init temp repos and commit (pre_sha assertions need a HEAD).
        run: |
          git config --global user.email "ci@token-saver.test"
          git config --global user.name "token-saver CI"

      - name: Trust slider + self-gate specs
        run: python3 specs/trust_spec.py

      - name: Engine default + refusal specs
        run: python3 specs/engine_spec.py
