name: tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Spec suite (full hermetic suite; dispatch_spec excluded — wall-clock flaky)
        run: bash ci/run-specs.sh
