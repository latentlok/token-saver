name: tests

on:
  pull_request:
  push:
    branches: [master]
  # Manual trigger. A release once sat blocked because no `pull_request` run was
  # ever created for an open, mergeable PR -- Actions enabled, workflow active,
  # file unchanged from master and valid, zero check runs. With no way to ask for
  # a run, the only remedies left were pushing a commit that did nothing or
  # merging on a local green, and the second is the one this project forbids.
  workflow_dispatch:

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Spec suite (full hermetic suite; dispatch_spec excluded — wall-clock flaky)
        run: bash ci/run-specs.sh
